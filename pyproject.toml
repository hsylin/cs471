[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skewbench"
version = "0.1.0"
description = "Reproducible migration-admission experiments for one distributed MoE layer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
weights = ["huggingface-hub>=0.30", "safetensors>=0.5"]

[tool.setuptools.packages.find]
include = ["skewbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

